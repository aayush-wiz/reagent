<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Google+Sans+Flex:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/fonts/GeistPixel.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Geist Pixel (self-hosted) — declared in the static <head> so it loads at parse time.
         Vite injects index.css via JS after React mounts, which delays the @font-face otherwise. */
      @font-face { font-family: 'Geist Pixel'; src: url('/fonts/GeistPixel.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    </style>
    <meta name="description" content="Autonomous research agents that read the literature, weigh the evidence, and run the experiment — then hand you a cited answer you can defend." />
    <title>reagent | Autonomous research agents</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
